name: Release (npm & Docker)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.1)'
        required: true
        type: string
      publish-npm:
        description: 'Publish to npm'
        required: false
        type: boolean
        default: false
      publish-docker:
        description: 'Publish to Docker Hub'
        required: false
        type: boolean
        default: true

env:
  DOCKER_IMAGE: countly/countly-mcp-server
  DOCKERHUB_USERNAME: countly

permissions:
  id-token: write  # Required for npm OIDC
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    name: Resolve version
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      is-release: ${{ steps.v.outputs.is-release }}
    steps:
      - name: Resolve version from tag or input
        id: v
        run: |
          # A tag push is a real release and is allowed to move ":latest".
          # A workflow_dispatch is a rehearsal: it publishes its version tag so
          # the build can be verified end to end, but must never repoint
          # ":latest" at a throwaway build that hosts would then deploy.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            IS_RELEASE=true
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            IS_RELEASE=false
          else
            VERSION="dev-${GITHUB_SHA::8}"
            IS_RELEASE=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is-release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (release: $IS_RELEASE)"

  test-and-build:
    runs-on: ubuntu-latest
    name: Test & Build
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run tests (with transport integration tests)
        run: npm run test:ci
        env:
          COUNTLY_SERVER_URL: https://test.count.ly
          COUNTLY_AUTH_TOKEN: test-token-for-ci

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: build/
          retention-days: 1

  # npm publishing is MANUAL. This job is opt-in and never runs on a tag push.
  # See RELEASING.md for the publish procedure.
  #
  # OIDC trusted publishing is not an option here: `countly-mcp-server` is
  # unscoped and owned by individual maintainer accounts rather than the
  # `countly` org, and npm only offers trusted-publisher configuration for
  # org-owned (`@countly/...`) packages. So the `id-token: write` permission
  # and the OIDC publish path below cannot currently succeed, and every release
  # from 1.2.1 onward has been published by hand.
  #
  # This job is left in place rather than deleted because it is one secret away
  # from working: a classic npm *automation token* (which does not expire and
  # bypasses 2FA) authorises publishing for unscoped packages. To automate,
  # add the token as an `NPM_TOKEN` repo secret, set
  # `NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}` on the publish step, and change
  # the `if:` below to also run on tag pushes.
  #
  # Note on diagnosing failures: `npm publish` answers an unauthorised PUT with
  #   npm error code E404
  #   npm error 404 Not Found - PUT https://registry.npmjs.org/countly-mcp-server
  # npm returns 404 rather than 403 so it does not confirm that a package
  # exists to a caller who cannot access it. E404 on publish is almost always
  # an auth problem, NOT a missing package -- check `npm whoami` first.
  #
  # Keeping this off tag pushes is deliberate: an expected red job in every
  # release run is how the six-hour Docker build timeout went unnoticed.
  # The npm-drift workflow catches a forgotten manual publish instead.
  publish-npm:
    runs-on: ubuntu-latest
    needs: [meta, test-and-build]
    name: Publish to npm
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' && inputs.publish-npm

    permissions:
      contents: read
      id-token: write   # Required for npm OIDC publish

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build
          path: build/

      - name: Update package.json version (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        run: npm version ${{ inputs.version }} --no-git-tag-version

      - name: Publish to npm (via OIDC trusted publisher)
        run: npm publish --access public

  # One job per architecture on native hardware, each pushing an untagged
  # image by digest. The previous single job built linux/amd64,linux/arm64 on
  # an amd64 runner, so the arm64 half ran under QEMU -- and because the
  # Dockerfile is multi-stage it emulated `npm ci` twice. That build hit the
  # six-hour job ceiling and was cancelled, which is why no 1.3.0 or 1.4.0
  # image was ever published. `ubuntu-24.04-arm` runners are free for public
  # repositories, so no emulation is needed.
  build-docker:
    name: Build ${{ matrix.arch }} image
    runs-on: ${{ matrix.runner }}
    needs: [meta, test-and-build]
    timeout-minutes: 30
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish-docker)

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.DOCKER_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          # Per-arch cache scopes; a single shared scope thrashes between the
          # two architectures and neither gets a warm cache.
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache-${{ matrix.arch }},mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          if [[ -z "$digest" ]]; then
            echo "::error::build produced no digest"
            exit 1
          fi
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the per-arch digests into one manifest list, so `docker pull` still
  # resolves the right architecture automatically.
  publish-docker:
    name: Publish manifest
    runs-on: ubuntu-latest
    needs: [meta, build-docker]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          TAGS=("-t" "${DOCKER_IMAGE}:${VERSION}")
          if [[ "${IS_RELEASE}" == "true" ]]; then
            TAGS+=("-t" "${DOCKER_IMAGE}:latest")
          else
            echo "Rehearsal build - leaving :latest untouched."
          fi
          # shellcheck disable=SC2046
          docker buildx imagetools create "${TAGS[@]}" \
            $(printf "${DOCKER_IMAGE}@sha256:%s " *)
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          IS_RELEASE: ${{ needs.meta.outputs.is-release }}

      - name: Verify both architectures are present
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${DOCKER_IMAGE}:${VERSION}"
          # Parse the index as JSON rather than grepping it: `--raw` emits
          # pretty-printed JSON, so a `"architecture":"amd64"` string match
          # misses the space after the colon and reports a false negative on a
          # manifest list that is actually correct.
          raw="$(docker buildx imagetools inspect "${DOCKER_IMAGE}:${VERSION}" --raw)"
          for arch in amd64 arm64; do
            echo "$raw" | jq -e --arg a "$arch" \
              'any(.manifests[]?.platform?; .architecture == $a and .os == "linux")' > /dev/null \
              || { echo "::error::linux/${arch} missing from manifest list"; exit 1; }
            echo "linux/${arch}: present"
          done
        env:
          VERSION: ${{ needs.meta.outputs.version }}

      - name: Update Docker Hub description
        if: needs.meta.outputs.is-release == 'true'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKER_IMAGE }}
          readme-filepath: ./DOCKER.md
          short-description: "MCP server for Countly Analytics - Access analytics tools via Model Context Protocol"

  # The Docker half of a release is automated; the npm half is not (see the
  # publish-npm comment above). This job turns "someone has to remember" into a
  # visible instruction on the run itself, with the exact commands. It does not
  # fail the release -- the Docker publish genuinely succeeded, and a red job
  # here would recreate the noise that hid the six-hour build timeout.
  npm-publish-reminder:
    name: npm publish reminder
    runs-on: ubuntu-latest
    needs: [meta, publish-docker]
    timeout-minutes: 5
    if: needs.meta.outputs.is-release == 'true'

    steps:
      - name: Check npm and write instructions
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          REPO: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          NPM_LATEST="$(curl -fsSL https://registry.npmjs.org/countly-mcp-server \
            | jq -r '."dist-tags".latest // "unknown"')"
          echo "npm latest: ${NPM_LATEST} | releasing: ${VERSION}"

          if [[ "${NPM_LATEST}" == "${VERSION}" ]]; then
            echo "npm is already on ${VERSION} - nothing to do."
            {
              echo "### npm: already published"
              echo
              echo "\`countly-mcp-server@${VERSION}\` is live on npm."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::warning title=npm publish still required::npm latest is ${NPM_LATEST}, this release is ${VERSION}. Publish by hand - see the run summary."
          {
            echo "### :warning: npm publish still required"
            echo
            echo "Docker is published. npm is on **${NPM_LATEST}**, this release is **${VERSION}**."
            echo
            echo "The welcome page and the support article both tell users to run"
            echo "\`npx countly-mcp-server@latest\`, so until this is done they get the older version."
            echo
            echo '```bash'
            echo "npm whoami   # must succeed first; E401 means the stored token expired"
            echo '```'
            echo
            echo '```bash'
            echo "rm -rf /tmp/cly-pub && git clone --depth 1 --branch v${VERSION} ${REPO}.git /tmp/cly-pub && cd /tmp/cly-pub && npm ci && npm publish --access public"
            echo '```'
            echo
            echo "Publish from the tag, not \`main\` -- \`main\` may already carry post-release commits."
            echo "See [RELEASING.md](${REPO}/blob/main/RELEASING.md) for the full procedure."
          } >> "$GITHUB_STEP_SUMMARY"
