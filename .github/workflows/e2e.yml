# Live end-to-end suite against the Countly dev servers (tests/e2e).
#
# Reusable only: called by e2e-nightly.yml (schedule / manual) and by
# release.yml as a gate before publishing. It deliberately never runs on pull
# requests: Dependabot and fork PRs get no repository secrets, and the dev
# servers change daily, so it would block unrelated merges.
#
# Secrets (per server KEY in LITE, ENTERPRISE, PLATFORM), see CONTRIBUTING.md:
#   MCP_E2E_<KEY>_ADMIN_TOKEN, MCP_E2E_<KEY>_USER_TOKEN, MCP_E2E_<KEY>_APP_ID
# Optional repository variables: MCP_E2E_<KEY>_URL to point at another server.
# MCP_E2E_GITHUB_TOKEN (read access to countly-server, countly-enterprise-plugins
# and countly-platform) enables the default-plugin snapshot check.
name: E2E (live servers)

on:
  workflow_call:
    inputs:
      require_secrets:
        description: 'Fail (instead of skip) when a server has no secrets configured'
        type: boolean
        required: false
        default: false
      skip_plugin_snapshot:
        description: 'Skip the check that src/lib/default-plugins.ts matches upstream'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  e2e:
    name: Live e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      MCP_E2E_REQUIRE_SECRETS: ${{ inputs.require_secrets && '1' || '0' }}
      MCP_E2E_SKIP_PLUGIN_SNAPSHOT: ${{ inputs.skip_plugin_snapshot && '1' || '0' }}
      MCP_E2E_GITHUB_TOKEN: ${{ secrets.MCP_E2E_GITHUB_TOKEN }}
      MCP_E2E_LITE_ADMIN_TOKEN: ${{ secrets.MCP_E2E_LITE_ADMIN_TOKEN }}
      MCP_E2E_LITE_USER_TOKEN: ${{ secrets.MCP_E2E_LITE_USER_TOKEN }}
      MCP_E2E_LITE_APP_ID: ${{ secrets.MCP_E2E_LITE_APP_ID }}
      MCP_E2E_LITE_URL: ${{ vars.MCP_E2E_LITE_URL }}
      MCP_E2E_ENTERPRISE_ADMIN_TOKEN: ${{ secrets.MCP_E2E_ENTERPRISE_ADMIN_TOKEN }}
      MCP_E2E_ENTERPRISE_USER_TOKEN: ${{ secrets.MCP_E2E_ENTERPRISE_USER_TOKEN }}
      MCP_E2E_ENTERPRISE_APP_ID: ${{ secrets.MCP_E2E_ENTERPRISE_APP_ID }}
      MCP_E2E_ENTERPRISE_URL: ${{ vars.MCP_E2E_ENTERPRISE_URL }}
      MCP_E2E_PLATFORM_ADMIN_TOKEN: ${{ secrets.MCP_E2E_PLATFORM_ADMIN_TOKEN }}
      MCP_E2E_PLATFORM_USER_TOKEN: ${{ secrets.MCP_E2E_PLATFORM_USER_TOKEN }}
      MCP_E2E_PLATFORM_APP_ID: ${{ secrets.MCP_E2E_PLATFORM_APP_ID }}
      MCP_E2E_PLATFORM_URL: ${{ vars.MCP_E2E_PLATFORM_URL }}
      NO_COLOR: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run live e2e suite
        run: npm run test:e2e -- --reporter=default --reporter=json --outputFile.json=e2e-results.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: e2e-results.json
          if-no-files-found: ignore
          retention-days: 14
