name: Release (npm & Docker)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.1)'
        required: true
        type: string
      publish-npm:
        description: 'Publish to npm'
        required: false
        type: boolean
        default: false
      publish-docker:
        description: 'Publish to Docker Hub'
        required: false
        type: boolean
        default: true

env:
  DOCKER_IMAGE: countly/countly-mcp-server
  DOCKERHUB_USERNAME: countly

permissions:
  id-token: write  # Required for npm OIDC
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    name: Resolve version
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      is-release: ${{ steps.v.outputs.is-release }}
    steps:
      - name: Resolve version from tag or input
        id: v
        run: |
          # A tag push is a real release and is allowed to move ":latest".
          # A workflow_dispatch is a rehearsal: it publishes its version tag so
          # the build can be verified end to end, but must never repoint
          # ":latest" at a throwaway build that hosts would then deploy.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            IS_RELEASE=true
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            IS_RELEASE=false
          else
            VERSION="dev-${GITHUB_SHA::8}"
            IS_RELEASE=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is-release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (release: $IS_RELEASE)"

  test-and-build:
    runs-on: ubuntu-latest
    name: Test & Build
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run tests (with transport integration tests)
        run: npm run test:ci
        env:
          COUNTLY_SERVER_URL: https://test.count.ly
          COUNTLY_AUTH_TOKEN: test-token-for-ci

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: build/
          retention-days: 1

  # npm publishing is opt-in and OFF by default, including on tag pushes.
  #
  # The trusted publisher for `countly-mcp-server` is not configured on
  # npmjs.com, so `npm publish` fails with:
  #   npm error code E404
  #   npm error 404 Not Found - PUT https://registry.npmjs.org/countly-mcp-server
  # This is npm's response when the presented OIDC credential is not authorised
  # for the package, not a missing-package error. It failed this way for v1.4.0
  # and 1.2.1/1.3.0/1.4.0 were all published by hand.
  #
  # Rather than let every release run go red on an expected failure -- which is
  # how the six-hour Docker timeout went unnoticed alongside it -- the job now
  # only runs when explicitly requested. To re-enable automated publishing:
  # configure the trusted publisher on npmjs.com for this repository and
  # workflow, then flip this back to run on tag pushes.
  publish-npm:
    runs-on: ubuntu-latest
    needs: [meta, test-and-build]
    name: Publish to npm
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' && inputs.publish-npm

    permissions:
      contents: read
      id-token: write   # Required for npm OIDC publish

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build
          path: build/

      - name: Update package.json version (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        run: npm version ${{ inputs.version }} --no-git-tag-version

      - name: Publish to npm (via OIDC trusted publisher)
        run: npm publish --access public

  # One job per architecture on native hardware, each pushing an untagged
  # image by digest. The previous single job built linux/amd64,linux/arm64 on
  # an amd64 runner, so the arm64 half ran under QEMU -- and because the
  # Dockerfile is multi-stage it emulated `npm ci` twice. That build hit the
  # six-hour job ceiling and was cancelled, which is why no 1.3.0 or 1.4.0
  # image was ever published. `ubuntu-24.04-arm` runners are free for public
  # repositories, so no emulation is needed.
  build-docker:
    name: Build ${{ matrix.arch }} image
    runs-on: ${{ matrix.runner }}
    needs: [meta, test-and-build]
    timeout-minutes: 30
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish-docker)

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.DOCKER_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          # Per-arch cache scopes; a single shared scope thrashes between the
          # two architectures and neither gets a warm cache.
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache-${{ matrix.arch }},mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          if [[ -z "$digest" ]]; then
            echo "::error::build produced no digest"
            exit 1
          fi
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the per-arch digests into one manifest list, so `docker pull` still
  # resolves the right architecture automatically.
  publish-docker:
    name: Publish manifest
    runs-on: ubuntu-latest
    needs: [meta, build-docker]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          TAGS=("-t" "${DOCKER_IMAGE}:${VERSION}")
          if [[ "${IS_RELEASE}" == "true" ]]; then
            TAGS+=("-t" "${DOCKER_IMAGE}:latest")
          else
            echo "Rehearsal build - leaving :latest untouched."
          fi
          # shellcheck disable=SC2046
          docker buildx imagetools create "${TAGS[@]}" \
            $(printf "${DOCKER_IMAGE}@sha256:%s " *)
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          IS_RELEASE: ${{ needs.meta.outputs.is-release }}

      - name: Verify both architectures are present
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${DOCKER_IMAGE}:${VERSION}"
          # Parse the index as JSON rather than grepping it: `--raw` emits
          # pretty-printed JSON, so a `"architecture":"amd64"` string match
          # misses the space after the colon and reports a false negative on a
          # manifest list that is actually correct.
          raw="$(docker buildx imagetools inspect "${DOCKER_IMAGE}:${VERSION}" --raw)"
          for arch in amd64 arm64; do
            echo "$raw" | jq -e --arg a "$arch" \
              'any(.manifests[]?.platform?; .architecture == $a and .os == "linux")' > /dev/null \
              || { echo "::error::linux/${arch} missing from manifest list"; exit 1; }
            echo "linux/${arch}: present"
          done
        env:
          VERSION: ${{ needs.meta.outputs.version }}

      - name: Update Docker Hub description
        if: needs.meta.outputs.is-release == 'true'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKER_IMAGE }}
          readme-filepath: ./DOCKER.md
          short-description: "MCP server for Countly Analytics - Access analytics tools via Model Context Protocol"
